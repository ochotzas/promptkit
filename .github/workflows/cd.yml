name: CD

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag must match __version__ and appear in the changelog
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          tag = os.environ["TAG"].lstrip("v")
          init = pathlib.Path("promptkit/__init__.py").read_text()
          match = re.search(r'__version__ = ["\']([^"\']+)["\']', init)

          if match is None:
              sys.exit("::error::__version__ not found in promptkit/__init__.py")

          version = match.group(1)
          problems = []

          if version != tag:
              problems.append(f"tag {tag!r} does not match __version__ {version!r}")

          changelog = pathlib.Path("CHANGELOG.md").read_text()

          if f"## [{version}]" not in changelog:
              problems.append(f"CHANGELOG.md has no '## [{version}]' section")

          for problem in problems:
              print(f"::error::{problem}")

          sys.exit(1 if problems else 0)
          PY

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  publish:
    name: Publish to PyPI
    needs: attest
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/promptkit-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check --output-format=github promptkit/ tests/
      - run: uv run ruff format --check promptkit/ tests/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy

  test:
    name: Test ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -v --cov=promptkit --cov-report=xml --cov-fail-under=80
      - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          flags: unittests
          use_oidc: true

  minimum-dependencies:
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.10"
      - run: uv sync --extra dev --resolution lowest-direct
        env:
          UV_FROZEN: "0"
      - run: uv run pytest tests/ -q

  base-install:
    name: Base install has no provider dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install without extras
        run: pip install .
      - name: Core works with no extras installed
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import promptkit
          from promptkit import load_prompt
          p = load_prompt('${{ github.workspace }}/examples/greet_user.yaml')
          print(p.render({'name': 'CI', 'context': 'base install'}))
          "
          promptkit lint "${{ github.workspace }}/examples/greet_user.yaml"
          promptkit cost "${{ github.workspace }}/examples/greet_user.yaml" --set name=CI
          promptkit engines
      - name: No provider SDK or HTTP client pulled in
        run: |
          for pkg in openai anthropic ollama tiktoken httpx httpx2; do
            if pip show "$pkg" >/dev/null 2>&1; then
              echo "::error::base install pulled in $pkg"
              exit 1
            fi
          done
          echo "base install is clean"

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv build
      - name: Wheel ships py.typed and excludes tests
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          problems = []
          if not any(n.endswith("promptkit/py.typed") for n in names):
              problems.append("py.typed missing from wheel")
          if any(n.startswith("tests/") or "/tests/" in n for n in names):
              problems.append("tests present in wheel")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest benchmarks/ --benchmark-json=benchmark.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: benchmark.json

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --extra docs
      - run: uv run mkdocs build --strict

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - minimum-dependencies
      - base-install
      - build
      - benchmarks
      - docs-build
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qvw success; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi
          echo "all CI jobs succeeded"

name: Bug report
description: Something in PromptKit does not work as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues must not be filed here — see [SECURITY.md](https://github.com/ochotzas/promptkit/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest prompt YAML and code that reproduces this.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback
      render: text
  - type: input
    id: version
    attributes:
      label: PromptKit version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12 on macOS 15"
    validations:
      required: true
